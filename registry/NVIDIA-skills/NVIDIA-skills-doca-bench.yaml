id: NVIDIA-skills-doca-bench
display_name: doca-bench
description: "Use this skill when the user is running `doca_bench` (DOCA \u2265 2.7.0)\
  \ \u2014 the cross-library micro-benchmark harness \u2014 to measure throughput,\
  \ bulk-latency, precision-latency, or max-bandwidth (the four `benchmark_mode` enum\
  \ values the binary ships) of a DOCA library (RDMA, COMPRESS, AES-GCM, SHA, DMA,\
  \ EC, ETH, Comch, GPUNetIO) on host or BlueField Arm, probe the granular- build\
  \ query for which libraries the install exposes, capture a baseline four-tuple (command,\
  \ version, device, environment), or diagnose a bench failure in the config-syntax,\
  \ device-binding, library/workload-precondition, or measurement-soundness layer.\
  \ Trigger even without the word \"doca_bench\" \u2014 typical implicit forms include\
  \ \"how fast is compress on my BlueField\", \"what RDMA throughput can this NIC\
  \ do\", \"measure AES-GCM latency\", or \"baseline before a firmware update\". Refuse\
  \ and route elsewhere for application-level end-to-end timing, custom benchmark\
  \ programs, DOCA install/upgrade, or patching the binary."
