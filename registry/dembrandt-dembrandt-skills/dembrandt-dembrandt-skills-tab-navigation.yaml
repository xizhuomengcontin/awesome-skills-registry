display_name: tab-navigation
description: "Tabs organise related content under a shared context \u2014 switching\
  \ tabs swaps the view without leaving the page. Use when a screen has multiple distinct\
  \ content areas that share a common header or action set, and when the user needs\
  \ to switch between them frequently. Use when designing tabbed layouts, content\
  \ panels, settings pages, detail views, or dashboards with multiple data views."
