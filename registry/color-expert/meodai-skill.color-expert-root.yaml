id: meodai-skill.color-expert-root
description: Use when working with color naming, color theory, color spaces, color
  definitions, or any task involving color knowledge - palettes, ramps, gradients,
  conversions, accessibility, perceptual matching, pigment mixing, print-vs-screen
  color, CSS color syntax, or historical color terminology. Use this skill whenever
  the user is choosing, comparing, generating, naming, converting, or explaining colors,
  even if they do not explicitly ask for "color theory."
