id: google-skills-datalineage-summary
display_name: datalineage-summary
description: Summarizes Google Cloud Data Lineage graphs to help users debug data
  quality issues and understand data provenance for BQ/GCS. Use when summarizing upstream
  and downstream data flows, and presenting complex lineage data as an intuitive Markdown
  report. Don't use for generic BigQuery queries, editing lineage relationships, or
  downstream deprecation. Don't use for downstream blast-radius impact analysis (use
  datalineage-bigquery-asset-impact-analysis skill instead).
