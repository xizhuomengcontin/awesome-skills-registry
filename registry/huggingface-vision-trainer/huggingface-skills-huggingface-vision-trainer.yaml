id: huggingface-skills-huggingface-vision-trainer
description: "Trains and fine-tunes vision models for object detection (D-FINE, RT-DETR\
  \ v2, DETR, YOLOS), image classification (timm models \u2014 MobileNetV3, MobileViT,\
  \ ResNet, ViT/DINOv3 \u2014 plus any Transformers classifier), and SAM/SAM2 segmentation\
  \ using Hugging Face Transformers on Hugging Face Jobs cloud GPUs. Covers COCO-format\
  \ dataset preparation, Albumentations augmentation, mAP/mAR evaluation, accuracy\
  \ metrics, SAM segmentation with bbox/point prompts, DiceCE loss, hardware selection,\
  \ cost estimation, Trackio monitoring, and Hub persistence. Use when users mention\
  \ training object detection, image classification, SAM, SAM2, segmentation, image\
  \ matting, DETR, D-FINE, RT-DETR, ViT, timm, MobileNet, ResNet, bounding box models,\
  \ or fine-tuning vision models on Hugging Face Jobs."
