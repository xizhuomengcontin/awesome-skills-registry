id: HeshamFS-materials-simulation-skills-simulation-failure-triage
description: Triage cross-code simulation failures and propose safe retry ladders
  for nonconvergence, NaN/Inf, exploding energies, unstable timesteps, pressure blow-up,
  missing potentials, bad pseudopotentials, corrupted output, and incomplete runs.
  Use when an agent sees a failed or suspicious materials simulation and needs a defensible
  first response.
