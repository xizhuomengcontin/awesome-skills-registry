id: mcollina-skills-octocat
display_name: Octocat
description: Use this skill whenever the prompt contains any `github.com` URL, even if the user only pastes a link and gives
  no GitHub-specific keywords. Handles git and GitHub operations using the gh CLI. Triggers include any GitHub link to an
  issue, pull request, commit, compare page, Actions run, release, discussion, or repository. Covers creating and reviewing
  PRs, watching CI checks, interactive rebasing, branch cleanup, submodule management, and repository archaeology with git
  log/blame/bisect.
