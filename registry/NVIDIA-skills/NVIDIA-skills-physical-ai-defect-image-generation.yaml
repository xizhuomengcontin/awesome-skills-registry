description: 'Use when the user wants to orchestrate defect image generation, run
  associated setup, or handle outputs on OSMO. The Day 0 path handles cold-start with
  USD-to-ROI, image-edit augmentation, and AnomalyGen to create initial PCBA datasets.
  The Day 1 path performs inference and labeling on real images. This skill helps
  with first-time asset setup, creation of finetuning checkpoints, and configuring
  deployment. Trigger keywords: defect image generation, dig workflow, dig pipeline,
  defect image detection workflow, aoi pipeline, aoi anomalygen, usd2roi anomalygen,
  day 0 pcba, day 1 pcba, day 1 real-photo alignment, day 1 manual roi, metal surface
  anomaly, glass defect, anomalygen finetune, setup_pcb, setup_metal, setup_glass,
  setup_pretrained, dig setup, dig datasets, dig pretrained checkpoint, dig image-edit
  endpoint.'
