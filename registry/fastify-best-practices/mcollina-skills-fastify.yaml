description: 'Guides development of Fastify Node.js backend servers and REST APIs using TypeScript or JavaScript. Use when
  building, configuring, or debugging a Fastify application — including defining routes, implementing plugins, setting up
  JSON Schema validation, handling errors, optimising performance, managing authentication, configuring CORS and security
  headers, integrating databases, working with WebSockets, and deploying to production. Covers the full Fastify request lifecycle
  (hooks, serialization, logging with Pino) and TypeScript integration via strip types. Trigger terms: Fastify, Node.js server,
  REST API, API routes, backend framework, fastify.config, server.ts, app.ts.'
