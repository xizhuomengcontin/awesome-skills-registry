id: coreyhaines31-marketingskills-copy-editing
description: When the user wants to edit, review, or improve existing marketing copy,
  or refresh outdated content. Also use when the user mentions 'edit this copy,' 'review
  my copy,' 'copy feedback,' 'proofread,' 'polish this,' 'make this better,' 'copy
  sweep,' 'tighten this up,' 'this reads awkwardly,' 'clean up this text,' 'too wordy,'
  'sharpen the messaging,' 'refresh this content,' 'update this page,' 'this content
  is outdated,' or 'content audit.' Use this when the user already has copy and wants
  it improved or refreshed rather than rewritten from scratch. For writing new copy,
  see copywriting.
