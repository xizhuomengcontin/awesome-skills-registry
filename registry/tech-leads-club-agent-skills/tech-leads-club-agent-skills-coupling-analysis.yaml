id: tech-leads-club-agent-skills-coupling-analysis
display_name: Coupling Analysis
description: Analyzes coupling between modules using the three-dimensional model (strength, distance, volatility) from "Balancing
  Coupling in Software Design". Use when asking "are these modules too coupled?", "show me dependencies", "analyze integration
  quality", "which modules should I decouple?", "coupling report", or evaluating architectural health. Do NOT use for domain
  boundary analysis (use domain-analysis) or component sizing (use component-identification-sizing).
