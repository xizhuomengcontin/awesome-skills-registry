id: Eronred-aso-skills-category-positioning
display_name: App Store Category Positioning
description: When the user wants to choose, change, or evaluate their App Store / Google Play category and subcategory — including
  primary vs secondary category trade-offs, chart-rank competitive analysis, category-driven discoverability, and how category
  choice affects featuring eligibility. Use when the user mentions "which category", "App Store category", "primary category",
  "secondary category", "change my category", "Health & Fitness vs Lifestyle", "Productivity vs Utilities", "rank higher in
  a smaller category", "category chart", "subcategory", "Play Store category", or "should I switch categories". For full ASO
  health beyond category, see aso-audit. For competitor analysis within the chosen category, see competitor-analysis. For
  chart movements within categories, see market-movers.
