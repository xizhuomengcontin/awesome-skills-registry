description: "Automatically activates when over-engineering patterns are detected:\
  \ (1) Modifying code or files the user did not explicitly ask to change (2) Creating\
  \ new abstraction layers (class, interface, factory, wrapper) without being asked\
  \ (3) Adding comments, documentation, JSDoc, or type annotations without being asked\
  \ (4) Introducing new dependencies without being asked (5) Rewriting entire files\
  \ instead of making minimal edits (6) Diff scope significantly exceeding the user's\
  \ request (7) User signals like \"too much\", \"don't change that\", \"only change\
  \ X\", \"keep it simple\", \"stop\" (8) Adding error handling, validation, or defensive\
  \ code for scenarios that cannot occur (9) Generating tests, configuration scaffolding,\
  \ or documentation without being asked \u5F53\u68C0\u6D4B\u5230\u8FC7\u5EA6\u5DE5\
  \u7A0B\u6A21\u5F0F\u65F6\u81EA\u52A8\u6FC0\u6D3B\uFF1A (1) \u4FEE\u6539\u7528\u6237\
