description: "S'active automatiquement lorsque des patterns de sur-ing\xE9nierie sont\
  \ d\xE9tect\xE9s : (1) Modifier du code ou des fichiers que l'utilisateur n'a pas\
  \ explicitement demand\xE9 de changer (2) Cr\xE9er de nouvelles couches d'abstraction\
  \ (class, interface, factory, wrapper) sans demande (3) Ajouter des commentaires,\
  \ de la documentation, JSDoc ou des annotations de type sans demande (4) Introduire\
  \ de nouvelles d\xE9pendances sans demande (5) R\xE9\xE9crire des fichiers entiers\
  \ au lieu de faire des modifications minimales (6) Le diff d\xE9passe significativement\
  \ la port\xE9e de la demande de l'utilisateur (7) L'utilisateur signale \"trop\"\
  , \"ne change pas \xE7a\", \"change seulement X\", \"garde \xE7a simple\", \"arr\xEA\
  te\" (8) Ajouter de la gestion d'erreurs, de la validation ou du code d\xE9fensif\
  \ pour des sc\xE9narios impossibles (9) G\xE9n\xE9rer des tests, du scaffolding\
  \ de configuration ou de la documentation sans demande"
