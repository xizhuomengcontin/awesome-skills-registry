name: Build and Upload Skills Registry

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  S3_IAM_ROLE_ARN: ${{ secrets.S3_IAM_ROLE_ARN }}

jobs:
  validate:
    name: Validate before build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint registry YAML files
        run: uv run python scripts/lint_registry.py

      - name: Set up CUE
        uses: cue-lang/setup-cue@v1.0.1

      - name: Validate (CUE)
        run: bash scripts/validate.sh

  build:
    name: Build unified JSON
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build unified JSON
        run: uv run python scripts/build_unified_json.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-skills
          path: dist/ai-skills.json

  upload:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-skills

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.S3_IAM_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload to S3 DevTest
        run: aws s3 cp ai-skills.json s3://${{ secrets.BUCKET_NAME }}/llm-gateway/v2/devtest/ai-skills.json

      - name: Upload to S3 Production
        run: aws s3 cp ai-skills.json s3://${{ secrets.BUCKET_NAME }}/llm-gateway/v2/prod/ai-skills.json
