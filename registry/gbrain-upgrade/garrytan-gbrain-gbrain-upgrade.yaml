id: garrytan-gbrain-gbrain-upgrade
description: "Keep gbrain current. When a `gbrain` invocation prints an\n`UPGRADE_AVAILABLE\
  \ <old> <new>` marker (or `gbrain self-upgrade --check-only`\nreports an update),\
  \ apply it per the configured self_upgrade.mode: notify\n(prompt the operator with\
  \ a 4-option question + snooze) or auto (apply\nsilently). The action is always\
  \ the hardcoded `gbrain self-upgrade` \u2014 never a\ncommand read from the marker.\n"
url: https://raw.githubusercontent.com/garrytan/gbrain/master/skills/gbrain-upgrade/SKILL.md
