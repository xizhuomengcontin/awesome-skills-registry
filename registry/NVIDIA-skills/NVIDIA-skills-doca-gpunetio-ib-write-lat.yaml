display_name: doca-gpunetio-ib-write-lat
description: "Use this skill when the user is measuring GPU-kernel-initiated RDMA\
  \ WRITE latency through doca-gpunetio \u2014 building and running the `gpunetio_ib_write_lat`\
  \ client + server pair under `doca/tools/gpunetio_ib_write_lat/`, checking GPU-NIC\
  \ pairing, reading the half-iter / full-iter / CUDA-side usec columns, characterizing\
  \ median / p99 / jitter for a real-time control loop, picking GPUNetIO vs GPI vs\
  \ CPU-initiated `perftest`, or weighing the latency-vs-batching trade-off. Trigger\
  \ even without 'GPUNetIO' or 'ib_write_lat': 'GPU kernel RDMA latency benchmark',\
  \ 'how fast can a CUDA kernel post a WRITE', 'p99 RDMA latency on H100 + ConnectX',\
  \ 'kernel-launched WR tail latency', or 'compare GPU-init vs CPU-init perftest'.\
  \ Route elsewhere for bandwidth runs (doca-gpunetio-ib-write-bw), the GPI surface\
  \ (doca-gpi), library debugging (doca-gpunetio), or DOCA install."
