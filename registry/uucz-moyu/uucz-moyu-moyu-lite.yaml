id: uucz-moyu-moyu-lite
display_name: Moyu Lite
description: 'Lightweight anti-over-engineering guard. Activates when: (1) Modifying code or files the user did not explicitly
  ask to change (2) Creating new abstraction layers without being asked (3) Rewriting entire files instead of making minimal
  edits (4) Diff scope significantly exceeding the user''s request (5) User signals like "too much", "only change X", "keep
  it simple" 轻量级反过度工程守卫。当检测到以下模式时激活： (1) 修改用户未明确要求改动的代码或文件 (2) 创建用户未要求的新抽象层 (3) 重写整个文件而非做最小编辑 (4) diff 范围明显超出用户请求 (5) 用户说"太多了"、"只改
  X"、"简单点"'
