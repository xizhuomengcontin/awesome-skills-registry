name: Lint Registry

on:
  pull_request:
    paths:
      - "registry/**/*.yaml"
  push:
    branches: [main]
    paths:
      - "registry/**/*.yaml"

jobs:
  lint-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint registry YAML files
        run: uv run python scripts/lint_registry.py
