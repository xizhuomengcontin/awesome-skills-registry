description: Detect unauthorized runtime drift in containers by monitoring binary
  execution, file system changes, and configuration deviations from the original immutable
  image, using tools like Falco and Microsoft Defender for Kubernetes/container workloads.
  Use when investigating possible container compromise, validating immutable-infrastructure
  controls, or hunting for unexpected package installs and file modifications inside
  running containers.
