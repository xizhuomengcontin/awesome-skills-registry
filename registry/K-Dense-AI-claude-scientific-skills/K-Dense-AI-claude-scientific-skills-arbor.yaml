id: K-Dense-AI-claude-scientific-skills-arbor
display_name: arbor
description: "Autonomously improve a real artifact (code, training recipe, agent harness,\
  \ data pipeline, prompt) against an objective and an evaluator, using Hypothesis\
  \ Tree Refinement (HTR) from the Arbor paper. Use this whenever someone wants to\
  \ iteratively optimize something over many experiments without overfitting \u2014\
  \ e.g. \"get my model's eval score up\", \"improve this agent/harness\", \"tune\
  \ this pipeline\", \"beat the baseline on this benchmark\", \"run a search over\
  \ approaches and keep the best\", \"do an MLE-bench / Kaggle-style optimization\"\
  , or any long-horizon \"make this artifact better and don't just memorize the dev\
  \ set\" task. Trigger it even when the user doesn't say \"Arbor\" or \"hypothesis\
  \ tree\" but describes repeated experiment-and-evaluate loops, branching exploration\
  \ of competing ideas, or worries about a dev/test gap. Runs Claude itself as the\
  \ coordinator with subagent executors in isolated git worktrees; for the standalone\
  \ `arbor` CLI tool see references/arbor-upstream.md."
