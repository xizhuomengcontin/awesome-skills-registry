id: tech-leads-club-agent-skills-security-ownership-map
display_name: Security Ownership Map
description: 'Analyze git repositories to build a security ownership topology (people-to-file), compute bus factor and sensitive-code
  ownership, and export CSV/JSON for graph databases and visualization. Use when the user explicitly wants a security-oriented
  ownership or bus-factor analysis grounded in git history (for example: orphaned sensitive code, security maintainers, CODEOWNERS
  reality checks for risk, sensitive hotspots, or ownership clusters). Do NOT use for general maintainer lists, non-security
  ownership questions, or threat modeling (use security-threat-model).'
