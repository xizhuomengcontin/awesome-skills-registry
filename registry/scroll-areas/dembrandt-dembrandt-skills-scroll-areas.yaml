display_name: Scroll Areas
description: Scroll areas inside a layout should be avoided wherever possible. When unavoidable, allow only one scroll axis
  at a time and always keep the user in control. Use when designing layouts, data tables, panels, or any component that might
  introduce an inner scroll container.
