id: dembrandt-dembrandt-skills-data-display-and-selection
display_name: Data Display and Selection
description: Complex data deserves multiple view modes — grid, list, table — chosen by the user based on their task. Row and
  item selection should use large hit areas (the whole row or card, not just a checkbox). Selected state is communicated through
  a subtle background colour shift. Mass actions appear when items are selected. Use when designing data tables, product listings,
  file browsers, or any multi-item collection.
