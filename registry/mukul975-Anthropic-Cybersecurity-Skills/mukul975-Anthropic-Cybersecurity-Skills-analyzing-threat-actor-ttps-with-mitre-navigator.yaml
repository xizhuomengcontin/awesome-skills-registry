description: Map advanced persistent threat (APT) group tactics, techniques, and procedures
  (TTPs) to the MITRE ATT&CK framework using the ATT&CK Navigator and attackcti Python
  library. The analyst queries STIX/TAXII data for group-technique associations, generates
  Navigator layer files for visualization, and compares defensive coverage against
  adversary profiles. Activates for requests involving APT TTP mapping, ATT&CK Navigator
  layers, threat actor profiling, or MITRE technique coverage analysis.
