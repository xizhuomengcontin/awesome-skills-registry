id: tech-leads-club-agent-skills-create-adr
display_name: Create ADR
description: Creates Architecture Decision Records (ADRs) to document significant architectural choices and their rationale
  for future team members. Use when the user says "write an ADR", "document this decision", "record why we chose X", "add
  an architecture decision record", "create an ADR for", or wants to capture the reasoning behind a technical choice so the
  team understands it later. Do NOT use when the decision hasn't been made yet (use create-rfc instead), for implementation
  planning (use technical-design-doc-creator), or for general documentation.
