id: google-skills-gke-platform-security
display_name: gke-platform-security
description: Plans, configures, and hardens platform-level Google Kubernetes Engine
  (GKE) cluster security. Covers cluster add-ons (Secret Manager enablement), RBAC
  hardening (disabling insecure bindings, audit tools), Binary Authorization, enabling
  Shielded Nodes, GKE Sandbox cluster enablement, GKE IAM roles, and cross-service
  authentication IAM patterns. Use when securing cluster control planes, hardening
  GKE RBAC, enabling Shielded Nodes, enabling GKE Sandbox runtime, enabling cluster-wide
  security add-ons, or managing GKE IAM roles. Don't use for workload-level security
  (Workload Identity, SecretProviderClass, PSS, NetPol, gVisor pod runtimeClassName;
  use gke-workload-security instead).
