id: tech-leads-club-agent-skills-tlc-spec-driven
description: Project and feature planning with 4 adaptive phases - Specify, Design,
  Tasks, Execute. Auto-sizes depth by complexity. Creates atomic tasks with verification
  criteria, atomic git commits, requirement traceability, and persistent memory across
  sessions. Stack-agnostic. Use when (1) Starting new projects (initialize vision,
  goals, roadmap), (2) Working with existing codebases (map stack, architecture, conventions),
  (3) Planning features (requirements, design, task breakdown), (4) Implementing with
  verification and atomic commits, (5) Quick ad-hoc tasks (bug fixes, config changes),
  (6) Tracking decisions/blockers/deferred ideas across sessions, (7) Pausing/resuming
  work. Triggers on "initialize project", "map codebase", "specify feature", "discuss
  feature", "design", "tasks", "implement", "validate", "verify work", "UAT", "quick
  fix", "quick task", "pause work", "resume work". Do NOT use for architecture decomposition
  analysis (use architecture skills) or technical design docs (use create-technical-design-doc).
