id: uucz-moyu-moyu-strict
description: "Strict anti-over-engineering enforcement. Activates on ANY code change\
  \ to verify scope: (1) Modifying code or files the user did not explicitly ask to\
  \ change (2) Creating new abstraction layers (class, interface, factory, wrapper)\
  \ without being asked (3) Adding comments, documentation, JSDoc, or type annotations\
  \ without being asked (4) Introducing new dependencies without being asked (5) Rewriting\
  \ entire files instead of making minimal edits (6) Diff scope significantly exceeding\
  \ the user's request (7) Adding error handling, validation, or defensive code for\
  \ scenarios that cannot occur (8) Generating tests, configuration scaffolding, or\
  \ documentation without being asked (9) Any diff exceeding 20 lines for a single-point\
  \ change \u4E25\u683C\u53CD\u8FC7\u5EA6\u5DE5\u7A0B\u6267\u884C\u6A21\u5F0F\u3002\
  \u4EFB\u4F55\u4EE3\u7801\u53D8\u66F4\u65F6\u6FC0\u6D3B\u4EE5\u9A8C\u8BC1\u8303\u56F4\
  \uFF1A (1) \u4FEE\u6539\u7528\u6237\u672A\u660E\u786E\u8981\u6C42\u6539\u52A8\u7684\
  \u4EE3\u7801\u6216\u6587\u4EF6 (2) \u521B\u5EFA\u7528\u6237\u672A\u8981\u6C42\u7684\
  \u65B0\u62BD\u8C61\u5C42 (3) \u6DFB\u52A0\u7528\u6237\u672A\u8981\u6C42\u7684\u6CE8\
  \u91CA\u3001\u6587\u6863\u3001\u7C7B\u578B\u6CE8\u89E3 (4) \u5F15\u5165\u7528\u6237\
  \u672A\u8981\u6C42\u7684\u65B0\u4F9D\u8D56 (5) \u91CD\u5199\u6574\u4E2A\u6587\u4EF6\
  \u800C\u975E\u505A\u6700\u5C0F\u7F16\u8F91 (6) diff \u8303\u56F4\u660E\u663E\u8D85\
  \u51FA\u7528\u6237\u8BF7\u6C42 (7) \u4E3A\u4E0D\u53EF\u80FD\u53D1\u751F\u7684\u573A\
  \u666F\u6DFB\u52A0\u9519\u8BEF\u5904\u7406 (8) \u672A\u88AB\u8981\u6C42\u5C31\u751F\
