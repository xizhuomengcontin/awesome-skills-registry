description: "Mobile, tablet, and desktop are different interaction paradigms \u2014\
  \ not the same layout scaled up or down. Sections can be hidden, repositioned, or\
  \ made sticky on mobile. Navigation and primary actions move. Use when designing\
  \ responsive layouts, adapting desktop UI for mobile, or deciding what to show on\
  \ each breakpoint."
