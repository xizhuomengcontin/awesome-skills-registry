description: "Triage a raw dump of external material \u2014 news, social threads,\
  \ community discussions, competitor moves, sales-call notes \u2014 into content\
  \ angles the brand has authority to make, each mapped to a pillar with a format\
  \ and timeliness window, plus an explicit dropped-signals list recording why the\
  \ rest were rejected. Triggers on \"/digital-marketing-pro:signal-mine\", \"mine\
  \ this\", \"what content is in here\", \"turn this industry news into ideas\", \"\
  any angles for us in this thread\". Requires the brand profile (pillars, audience,\
  \ competitors) and stops without one; unverified claims route to /digital-marketing-pro:verify-claims\
  \ before anything cites them; surviving angles feed /digital-marketing-pro:content-engine."
