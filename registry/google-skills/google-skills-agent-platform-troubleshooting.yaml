id: google-skills-agent-platform-troubleshooting
display_name: agent-platform-troubleshooting
description: Troubleshoots Google Cloud Gemini Enterprise Agent Platform issues (Agent
  Gateway, Registry, Identity, Policies, Model Armor, Identity-Aware Proxy (IAP)).
  Use when agent requests fail with 403 (especially unauthorized egress), Agent Runtime
  queries return 500, or gateway/IAP logs show permission errors. Don't use for general
  Google Cloud Identity and Access Management (IAM) debugging or networking issues
  unrelated to the Agent Platform stack.
