id: mukul975-Anthropic-Cybersecurity-Skills-securing-github-actions-workflows
display_name: securing-github-actions-workflows
description: This skill covers hardening GitHub Actions workflows against supply chain
  attacks, credential theft, and privilege escalation. It addresses pinning actions
  to SHA digests, minimizing GITHUB_TOKEN permissions, protecting secrets from exfiltration,
  preventing script injection in workflow expressions, and implementing required reviewers
  for workflow changes.
