id: EveryInc-charlie-cfo-skill-root
description: Your AI CFO for bootstrapped startups, named after Charlie Munger who
  embodied the principle that capital discipline is a competitive advantage. Provides
  financial frameworks for cash management, runway calculations, unit economics (LTV:CAC),
  capital allocation, hiring ROI, burn rate analysis, working capital optimization,
  and forecasting. Use for questions like "should we make this hire?", "how much runway
  do we need?", "what metrics should I track?", "how do I forecast revenue?", or any
  strategic financial decision at a self-funded company.
