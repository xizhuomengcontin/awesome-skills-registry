description: Sparse4D for multi-camera temporal 3D object detection and tracking.
  Uses sparse queries with deformable attention across camera views and time for end-to-end
  3D perception, with an instance bank for temporal tracking. Use when training, evaluating,
  exporting, quantizing, or running inference for a TAO Sparse4D model. Trigger phrases
  include "train Sparse4D", "multi-camera 3D detection", "temporal 3D tracker", "sparse
  query 3D perception".
