id: aklofas-kicad-happy-lcsc
display_name: LCSC Electronics
description: Search LCSC Electronics for electronic components — find parts by LCSC number (Cxxxxx) or MPN, check stock/pricing,
  download datasheets, analyze specifications. Sister company to JLCPCB, same parts library. Sync and maintain a local datasheets
  directory for a KiCad project, or use batch MPN-list seeding (`--mpn-list`) for bulk workflows without a project. No API
  key needed — uses the free jlcsearch community API. Use this skill when the user mentions LCSC, JLCPCB parts library, JLCPCB
  assembly parts, production sourcing, Cxxxxx part numbers, needs to find LCSC equivalents for parts, is preparing a BOM for
  JLCPCB assembly, or wants to download datasheets and LCSC is available. For package cross-reference tables and BOM workflow,
  see the `bom` skill.
