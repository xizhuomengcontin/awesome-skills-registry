id: aklofas-kicad-happy-element14
description: "Search Newark, Farnell, and element14 for electronic components \u2014\
  \ find parts by MPN or distributor part number, check pricing/stock, download datasheets,\
  \ analyze specifications. One unified API covers all three storefronts (Newark for\
  \ US, Farnell for UK/EU, element14 for APAC). Free API key, simple query-parameter\
  \ auth, no OAuth. Datasheets download directly from farnell.com CDN with no bot\
  \ protection. Sync and maintain a local datasheets directory for a KiCad project,\
  \ or use batch MPN-list seeding (`--mpn-list`) for bulk workflows without a project.\
  \ Use this skill when the user mentions Newark, Farnell, element14, needs parts\
  \ from a non-US distributor, wants to compare pricing across regions, or needs datasheets\
  \ from a source that doesn't require complex API auth. For package cross-reference\
  \ tables and BOM workflow, see the `bom` skill."
