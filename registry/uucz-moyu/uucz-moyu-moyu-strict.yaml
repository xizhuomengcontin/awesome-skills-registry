id: uucz-moyu-moyu-strict
display_name: Moyu Strict
description: 'Strict anti-over-engineering enforcement. Activates on ANY code change to verify scope: (1) Modifying code or
  files the user did not explicitly ask to change (2) Creating new abstraction layers (class, interface, factory, wrapper)
  without being asked (3) Adding comments, documentation, JSDoc, or type annotations without being asked (4) Introducing new
  dependencies without being asked (5) Rewriting entire files instead of making minimal edits (6) Diff scope significantly
  exceeding the user''s request (7) Adding error handling, validation, or defensive code for scenarios that cannot occur (8)
  Generating tests, configuration scaffolding, or documentation without being asked (9) Any diff exceeding 20 lines for a
  single-point change 严格反过度工程执行模式。任何代码变更时激活以验证范围： (1) 修改用户未明确要求改动的代码或文件 (2) 创建用户未要求的新抽象层 (3) 添加用户未要求的注释、文档、类型注解 (4) 引入用户未要求的新依赖
  (5) 重写整个文件而非做最小编辑 (6) diff 范围明显超出用户请求 (7) 为不可能发生的场景添加错误处理 (8) 未被要求就生成测试、配置、文档 (9) 单点改动 diff 超过 20 行'
