id: K-Dense-AI-claude-scientific-skills-pennylane
display_name: PennyLane
description: Hardware-agnostic quantum ML framework with automatic differentiation. Use when training quantum circuits via
  gradients, building hybrid quantum-classical models, or needing device portability across IBM/Google/Rigetti/IonQ. Best
  for variational algorithms (VQE, QAOA), quantum neural networks, and integration with PyTorch or JAX. For hardware-specific
  optimizations use qiskit (IBM) or cirq (Google); for open quantum systems use qutip.
