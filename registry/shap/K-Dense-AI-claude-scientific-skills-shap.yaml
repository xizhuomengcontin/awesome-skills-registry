display_name: SHAP Model Explainability
description: Model interpretability and explainability using SHAP (SHapley Additive exPlanations). Use this skill when explaining
  machine learning model predictions, computing feature importance, generating SHAP plots (waterfall, beeswarm, bar, scatter,
  force, heatmap), debugging models, analyzing model bias or fairness, comparing models, or implementing explainable AI. Works
  with tree-based models (XGBoost, LightGBM, Random Forest), deep learning (TensorFlow, PyTorch), linear models, and any black-box
  model.
