display_name: Create Rfc
description: Creates structured Request for Comments (RFC) documents for proposing and deciding on significant changes. Use
  when the user says "write an RFC", "create a proposal", "I need to propose a change", "draft an RFC", "document a decision",
  or needs stakeholder alignment before making a major technical or process decision. Do NOT use for TDDs/implementation docs
  (use technical-design-doc-creator instead), README files, or general documentation.
