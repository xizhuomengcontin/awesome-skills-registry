id: K-Dense-AI-claude-scientific-skills-ontology-term-resolution
display_name: ontology-term-resolution
description: Resolve free-text scientific labels to ontology term IDs and validate
  existing CURIEs against the EBI Ontology Lookup Service (OLS4). Use whenever an
  ontology identifier must be produced or checked - annotating tissue, cell type,
  disease, phenotype, assay, chemical, organism, sex, or developmental stage fields;
  preparing metadata for GEO, ENA, BioSamples, CELLxGENE, HCA, or ISA-Tab submission;
  auditing a metadata table of term IDs; checking whether a term is obsolete and what
  replaced it; or mapping between ontologies. Triggers include "ontology term", "ontology
  ID", "CURIE", "controlled vocabulary", "UBERON", "CL:", "MONDO", "HPO", "EFO", "ChEBI",
  "NCBITaxon", "GO term", "PATO", "annotate this tissue/cell type/disease", and any
  request to emit or verify an identifier shaped like PREFIX:0001234.
