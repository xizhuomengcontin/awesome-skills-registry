id: lawvable-awesome-legal-skills-tech-contract-negotiation-patrick-munro
description: 'Guide to negotiating technology services agreements, professional services
  contracts, and commercial B2B transactions. Provides three-position frameworks (provider-favorable,
  balanced, client-favorable), deal-size tactics, objection handling templates, and
  concession roadmaps. Use when: (1) Developing negotiation strategies for SaaS, cloud,
  or managed services agreements, (2) Preparing position papers and fallback positions,
  (3) Responding to counterparty objections and demands, (4) Creating concession roadmaps
  that protect critical interests, (5) Assessing tactics based on deal value and leverage,
  or (6) Structuring balanced outcomes for liability, IP, payment, SLA, or warranty
  provisions.'
