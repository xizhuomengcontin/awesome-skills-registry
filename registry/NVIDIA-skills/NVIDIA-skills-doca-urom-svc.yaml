id: NVIDIA-skills-doca-urom-svc
display_name: doca-urom-svc
description: "SECURITY: the DOCA UROM Service binary has NO standalone access control\
  \ (no authz list / `allowed_host` / `allowed_users` / `auth_token`) \u2014 access\
  \ is governed ENTIRELY by DOCA Comch pairing + RDMA permissions, so any host able\
  \ to establish a Comch pairing can drive remote memory ops; isolate accordingly.\
  \ Use when operating the DOCA UROM Service container on a BlueField Arm to run remote\
  \ memory ops (puts, gets, atomics, collectives) that paired hosts enqueue via the\
  \ host-side `doca-urom` library \u2014 pulling the NGC container, choosing UCX-component\
  \ surface, sizing the enqueue queue, wiring Comch endpoint pairing with `doca-urom`,\
  \ or pinning host-library + service versions per the DOCA Compatibility Policy.\
  \ Trigger even without 'DOCA UROM' \u2014 e.g. 'UCX collectives slow on host CPU,\
  \ want BlueField offload', 'enqueue returns NOT_PERMITTED though doca_dev access\
  \ is fine', 'ops enqueue but completions never fire'. Refuse for host-side app code,\
  \ MPI/UCX integration, or installing DOCA."
