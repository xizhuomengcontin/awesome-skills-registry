id: lawvable-awesome-legal-skills-assignation-refere-communication-associe-selim-brihi
display_name: Assignation Référé - Communication Associé
description: Rédaction d'assignations en référé devant le tribunal de commerce ou des activités économiques pour le droit
  de communication d'un associé. Utiliser ce skill quand l'utilisateur demande de rédiger, préparer ou créer une assignation
  en référé fondée sur l'article L. 238-1 du code de commerce pour obtenir la communication forcée de documents sociaux (comptes
  annuels, rapports de gestion, PV d'assemblées, etc.) lorsqu'un dirigeant refuse ou fait obstruction à la communication de
  ces documents à un associé.
