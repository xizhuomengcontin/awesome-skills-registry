id: mukul975-Anthropic-Cybersecurity-Skills-hardening-docker-daemon-configuration
display_name: hardening-docker-daemon-configuration
description: Harden the Docker daemon (dockerd) by configuring /etc/docker/daemon.json
  with user namespace remapping, TLS client authentication, seccomp profiles, and
  CIS Docker Benchmark controls such as icc, no-new-privileges, and live-restore.
  Use when securing a Docker host's daemon configuration to prevent privilege escalation,
  container breakout, or lateral movement, or when auditing daemon settings against
  CIS benchmark requirements.
