description: "Build clinical/healthcare deep-learning pipelines with PyHealth \u2014\
  \ loading EHR/signal/imaging datasets (MIMIC-III/IV, eICU, OMOP, SleepEDF, ChestXray14,\
  \ EHRShot), defining tasks (mortality, readmission, length-of-stay, drug recommendation,\
  \ sleep staging, ICD coding, EEG events), instantiating models (Transformer, RETAIN,\
  \ GAMENet, SafeDrug, MICRON, StageNet, AdaCare, CNN/RNN/MLP), training with the\
  \ PyHealth Trainer, computing clinical metrics, and using medical code utilities\
  \ (ICD/ATC/NDC/RxNorm lookup and cross-mapping). Use this skill whenever the user\
  \ mentions PyHealth, MIMIC, eICU, OMOP, EHR modeling, clinical prediction, drug\
  \ recommendation, sleep staging, medical code mapping, ICD/ATC codes, or any healthcare\
  \ ML pipeline that fits the dataset \u2192 task \u2192 model \u2192 trainer \u2192\
  \ metrics pattern, even if \"PyHealth\" isn't named explicitly."
