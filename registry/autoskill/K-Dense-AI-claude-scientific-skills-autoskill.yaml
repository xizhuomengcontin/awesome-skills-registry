id: K-Dense-AI-claude-scientific-skills-autoskill
description: "Observe the user's screen via screenpipe, detect repeated research workflows,\
  \ match them against existing scientific-agent-skills, and draft new skills (or\
  \ composition recipes that chain existing ones) for the patterns not yet covered.\
  \ Use when the user asks to analyze their recent work and propose skills based on\
  \ what they actually do. Requires the screenpipe daemon (https://github.com/screenpipe/screenpipe)\
  \ running locally on port 3030 \u2014 the skill has no other data source and will\
  \ refuse to run if screenpipe is unreachable. All detection runs locally; only redacted\
  \ cluster summaries reach the LLM."
