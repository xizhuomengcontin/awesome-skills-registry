id: garrytan-gbrain-schema-unify
display_name: Schema Unify
description: Migrate a brain from gbrain-base (or any pack) to gbrain-base-v2's 14-canonical-type taxonomy via gbrain onboard
  --check + the unify-types Minion handler. Collapses 94 noisy types to 15 canonical with subtypes, alias rows, and link rows.
  Triggers when an agent notices pack_upgrade_available, type_proliferation, or asks "what is the canonical taxonomy / how
  do I clean up my page types".
