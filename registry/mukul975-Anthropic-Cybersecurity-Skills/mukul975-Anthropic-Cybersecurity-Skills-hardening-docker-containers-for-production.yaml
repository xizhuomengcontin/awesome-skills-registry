description: 'Harden Dockerfiles, images, and container runtime settings against the
  CIS Docker Benchmark v1.8.0: non-root users, dropped capabilities, read-only rootfs,
  seccomp/AppArmor, and minimal multi-stage images, validated with docker-bench-security,
  Hadolint, and Dockle. Use when preparing a container or Dockerfile for production,
  or auditing images/runtime configs against CIS Docker controls.'
