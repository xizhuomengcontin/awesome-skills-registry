id: dembrandt-dembrandt-skills-global-toolbar-controls
display_name: Global Toolbar Controls
description: Quick global settings — currency, language, region, units — belong in a persistent, low-profile location such
  as a header toolbar or footer. These controls are frequent but not primary, so they use small typography and stay out of
  the main content hierarchy. Use when designing global selectors, locale switchers, or user preference controls that apply
  across the whole product.
