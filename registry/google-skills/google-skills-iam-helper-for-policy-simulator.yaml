id: google-skills-iam-helper-for-policy-simulator
display_name: iam-helper-for-policy-simulator
description: Safely simulates and applies Google Cloud IAM v1 (Allow) policy changes.
  Uses the Policy Simulator to replay historical access logs against proposed policies
  to prevent breaking active workloads before applying the changes. Use when simulating
  or applying IAM v1 allow policies across Projects, Folders, or Organizations. Don't
  use for analyzing IAM v2 deny policies, VPC Service Controls, or performing general
  policy troubleshooting.
