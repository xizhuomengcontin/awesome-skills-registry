description: "Everything In Its Right Place. The universal post-work organizer. After\n\
  any significant work session, EIIRP runs a 7-phase audit: (1) inventory\nevery output,\
  \ (2) walk taxonomy to decide where each lands, (3) check\nschema-pack consistency\
  \ against the brain's actual shape, (4) file\nenriched brain pages, (5) audit the\
  \ skill graph for DRY+MECE, (6) verify\nresolvability, (7) report. Named after the\
  \ Radiohead song. Nothing\nproduced during significant work lives only in chat \u2014\
  \ knowledge becomes\npermanent, patterns become reusable.\n"
