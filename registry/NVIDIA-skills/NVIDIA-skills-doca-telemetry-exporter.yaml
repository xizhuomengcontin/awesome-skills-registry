id: NVIDIA-skills-doca-telemetry-exporter
display_name: doca-telemetry-exporter
description: "Use this skill when the user is doing hands-on DOCA Telemetry Exporter\
  \ programming on a host where DOCA is installed \u2014 defining a doca_telemetry_exporter_schema,\
  \ creating sources, picking counter/gauge/event types, running capability queries\
  \ before assuming limits, registering schemas before the first emit, or debugging\
  \ DOCA_ERROR_* failures from the exporter API. Trigger even when the user does not\
  \ explicitly mention \"DOCA Telemetry Exporter\" or \"doca_telemetry_exporter_*\"\
  \ \u2014 typical implicit phrasings include \"publishing counters from my DOCA app\"\
  , \"emit returns AGAIN under bulk load\", \"consumer sees nothing but emit reports\
  \ success\", \"NOT_FOUND on first submit\", or \"should I link the exporter or the\
  \ telemetry service\". Refuse and route elsewhere for the receiving DOCA Telemetry\
  \ Service, plain stdout logging via doca_log, non-DOCA Prometheus scrape sinks,\
  \ or real-time event subscription back into the app via doca-comch \u2014 those\
  \ belong to other skills."
