description: 'Elite incident response and legal compliance guidance for data breaches
  under GDPR Articles 33 & 34. Use when: (1) User reports a data breach or security
  incident, (2) User asks about breach notification obligations or deadlines, (3)
  User mentions "72 hours", Art. 33, Art. 34, or notification requirements, (4) Discussion
  involves security incidents affecting personal data, (5) User needs breach risk
  assessment using ENISA methodology, (6) User mentions "Data Breach" or "Incident"
  or "Data Leakage" or "Ransomeware" or "Exfiltration", (7) User needs to determine
  Controller vs Processor obligations, (8) Cross-border breach scenarios requiring
  Lead SA determination, (9) User needs a mitigation playbook or immediate response
  recommendations, (10) User needs to generate audit-ready breach documentation (.docx).'
