id: aklofas-kicad-happy-emc
display_name: KiCad EMC Pre-Compliance Analyzer
description: EMC pre-compliance risk analysis for KiCad PCB designs — 18 check categories, 44 rule IDs covering ground planes,
  decoupling, I/O filtering, switching harmonics, clock routing, differential pair skew, board edge radiation, PDN impedance,
  return paths, crosstalk, ESD protection, shielding, and magnetic leakage from switching inductors. Produces severity-ranked
  risk report with pre-compliance test plan. Supports FCC Part 15, CISPR 32, CISPR 25 (automotive), MIL-STD-461G. SPICE-enhanced
  when available. Use when the user asks about EMC, EMI, radiated/conducted emissions, FCC compliance, CE marking, CISPR,
  ground plane issues, decoupling strategy, clock routing EMC, switching noise, differential pair skew, or whether their board
  will pass EMC testing. Also for "will this pass FCC?", "check my EMC", "is my ground plane okay?", "check my decoupling",
  or "generate an EMC test plan".
