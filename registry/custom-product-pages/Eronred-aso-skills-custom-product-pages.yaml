id: Eronred-aso-skills-custom-product-pages
description: "When the user wants to design, deploy, or measure Apple Custom Product\
  \ Pages (CPP) \u2014 the alternate App Store product pages with different screenshots,\
  \ preview videos, and promo text shown to users coming from specific URLs (typically\
  \ ad campaigns or social posts). Use when the user mentions \"Custom Product Page\"\
  , \"CPP\", \"alternate product page\", \"App Store URL variant\", \"ASA CPP\", \"\
  campaign-specific landing page\", \"product page per audience\", \"App Store Connect\
  \ CPP\", \"ppoUrl\", \"?cpp=\" parameter, or \"show different screenshots to different\
  \ ad audiences\". For App Store A/B tests on the default page, see ab-test-store-listing.\
  \ For paid ad campaigns that route to CPPs, see apple-search-ads or ua-campaign."
