description: Read, search, and download emails and attachments from Microsoft Outlook
  via OAuth2. Use when the user asks to (1) check, read, or fetch emails or messages
  from Outlook, (2) search emails by keyword, sender, or subject, (3) download email
  attachments such as contracts, NDAs, or documents, (4) chain email content into
  other skills (e.g. "read the latest email from X and review the attached NDA"),
  or (5) any task involving Microsoft Outlook, Office 365, or Exchange email access.
