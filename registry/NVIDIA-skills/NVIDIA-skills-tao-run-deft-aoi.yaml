id: NVIDIA-skills-tao-run-deft-aoi
display_name: tao-run-deft-aoi
description: "Run the full DEFT AOI improvement loop for NVIDIA TAO VisualChangeNet\
  \ / ChangeNet PCB inspection models: baseline evaluate, RCA, ingestion of customer-supplied\
  \ pre-generated AnomalyGen images, k-NN mining, retraining, and deployment gating\
  \ until FAR / recall KPI targets are met. EA variant \u2014 does not run AnomalyGen\
  \ inline; the customer pre-generates synthetic NG/OK pairs out-of-band and the loop\
  \ ingests them. Use for prompts like \"run the DEFT loop\", \"fine-tune until FAR\
  \ below 0.1% at recall=100%\", or \"improve my AOI ChangeNet model with RCA and\
  \ pre-generated synthetic defects\"; do not use for standalone TAO training, one-off\
  \ inference, generic anomaly generation, or RCA-only analysis."
