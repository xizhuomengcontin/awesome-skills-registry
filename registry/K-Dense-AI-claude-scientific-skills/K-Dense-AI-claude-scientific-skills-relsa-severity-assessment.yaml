id: K-Dense-AI-claude-scientific-skills-relsa-severity-assessment
display_name: relsa-severity-assessment
description: "Multivariate severity assessment and humane endpoint prediction for\
  \ laboratory animal studies using the RELSA (RELative Severity Assessment) score\
  \ and ARIMA-based foRcast forecasting. Use when combining welfare readouts \u2014\
  \ body weight or weight loss, body temperature, clinical or nesting scores, biomarkers,\
  \ activity, heart rate, burrowing, wheel running \u2014 into one severity score\
  \ per animal per day, when asking which animals are at risk of reaching a humane\
  \ endpoint or when one will be reached, when defining attention/danger zones or\
  \ thresholds on a severity scale by kernel density estimation, or when reporting\
  \ severity for a 3Rs, refinement, animal-welfare, or EU Directive 2010/63/EU severity-assessment\
  \ context. Covers directionality (\"turned\" variables), baseline normalization,\
  \ reference sets, RELSA weights, ARIMA prediction intervals, and RMSE/PICP/MPIW\
  \ evaluation."
