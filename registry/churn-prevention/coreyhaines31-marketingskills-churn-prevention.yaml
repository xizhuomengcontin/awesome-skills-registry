id: coreyhaines31-marketingskills-churn-prevention
description: When the user wants to reduce churn, build cancellation flows, set up
  save offers, recover failed payments, or implement retention strategies. Also use
  when the user mentions 'churn,' 'cancel flow,' 'offboarding,' 'save offer,' 'dunning,'
  'failed payment recovery,' 'win-back,' 'retention,' 'exit survey,' 'pause subscription,'
  'involuntary churn,' 'people keep canceling,' 'churn rate is too high,' 'how do
  I keep users,' or 'customers are leaving.' Use this whenever someone is losing subscribers
  or wants to build systems to prevent it. For post-cancel win-back email sequences,
  see emails. For in-app upgrade paywalls, see paywalls.
