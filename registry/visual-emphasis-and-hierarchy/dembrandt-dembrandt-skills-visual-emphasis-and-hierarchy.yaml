id: dembrandt-dembrandt-skills-visual-emphasis-and-hierarchy
description: "The most important actions and content in a UI should be visually prominent\
  \ \u2014 through size, colour, weight, and position. Visual hierarchy guides the\
  \ user's eye to what matters most and signals which action is primary. Use when\
  \ designing button groups, CTAs, dashboards, cards, or any layout where actions\
  \ or content have different importance levels."
