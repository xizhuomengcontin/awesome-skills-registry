id: dembrandt-dembrandt-skills-ui-density
display_name: UI Density
description: UI density — how much information and how many features appear at once — should match the primary platform and
  user type. Desktop supports dense, feature-rich interfaces; mobile requires focused, reduced layouts. Enterprise power users
  tolerate higher density than occasional users. Use when designing data tables, dashboards, toolbars, or adapting a desktop
  product for mobile.
