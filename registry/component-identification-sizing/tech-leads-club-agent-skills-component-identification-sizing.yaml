id: tech-leads-club-agent-skills-component-identification-sizing
description: Maps architectural components in a codebase and measures their size to
  identify what should be extracted first. Use when asking "how big is each module?",
  "what components do I have?", "which service is too large?", "analyze codebase structure",
  "size my monolith", or planning where to start decomposing. Do NOT use for runtime
  performance sizing or infrastructure capacity planning.
