id: NVIDIA-skills-doca-flow-dpa-perf
display_name: doca-flow-dpa-perf
description: "Use this skill when the user is invoking doca_flow_dpa_perf on DPA-capable\
  \ hardware (ConnectX-7+ or BlueField-3) to measure rule update / disable rates on\
  \ the DPA-offloaded DOCA Flow path \u2014 picking the active / passive device split,\
  \ choosing workload-shape axes (burst, queue, completion threshold, workers, hash\
  \ pipe algo, PSL tables), or reading Kops/sec iteration stats and the optional self-test.\
  \ Trigger even when the user does not explicitly mention \"doca_flow_dpa_perf\"\
  \ or \"DPA Provider\" \u2014 typical implicit phrasings include \"how fast can the\
  \ DPA program path-selector entries\", \"baseline rule-update rate on ConnectX-8\"\
  , \"tool reports zero ops on my BlueField\", \"self-test sentinel never shows on\
  \ tcpdump\", or \"is my BlueField-2 DPA-capable\". Refuse and route elsewhere for\
  \ the host / DPU-CPU Flow path (doca-flow-perf), Flow pipeline tuning (doca-flow-tune),\
  \ writing doca-flow / doca-dpa applications, or DOCA install \u2014 those belong\
  \ to other skills."
