description: Groups existing components into logical business domains to plan service-based
  architecture. Use when asking "which components belong together?", "group these
  into services", "organize by domain", "component-to-domain mapping", or planning
  service extraction from an existing codebase. Do NOT use for identifying new domains
  from scratch (use domain-analysis) or analyzing coupling (use coupling-analysis).
