id: video-db-skills-python
display_name: videodb
description: See, Understand, Act on video and audio. See- ingest from local files,
  URLs, RTSP/live feeds, or live record desktop; return realtime context and playable
  stream links. Understand- run analyzers over speech, scenes, objects, OCR, brands
  and activity; build searchable indexes; then search moments, ask questions about
  a video, filter and aggregate results with timestamps and auto-clips. Act- transcode
  and normalize (codec, fps, resolution, aspect ratio), perform timeline edits (subtitles,
  text/image overlays, branding, audio overlays, dubbing, translation), generate media
  assets (image, audio, video), and create real time alerts for events from live streams
  or desktop capture.
