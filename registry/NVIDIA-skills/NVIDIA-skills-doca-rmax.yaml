id: NVIDIA-skills-doca-rmax
display_name: doca-rmax
description: "Use this skill when the user is doing hands-on DOCA Rivermax work on\
  \ a BlueField DPU or ConnectX host \u2014 standing up `doca_rmax_in_stream` (receive)\
  \ sessions for timing-precise media-over-IP (SMPTE ST 2110 video/audio, market data,\
  \ scientific feeds), confirming the Rivermax SDK + license precondition before any\
  \ DOCA-side code, running `doca_rmax_get_*_supported` capability queries, pairing\
  \ with `doca-eth` queues and `doca-flow` steering, or debugging `DOCA_ERROR_*` from\
  \ a Rivermax call. Trigger even when the user does not explicitly mention \"DOCA\
  \ Rivermax\" or \"rmax\" \u2014 implicit phrasings include \"ST 2110 receive isn't\
  \ getting frames\", \"sub-microsecond jitter on BlueField\", \"NOT_PERMITTED on\
  \ first rivermax create\", \"no recv events after stream start\", or \"license check\
  \ failing on a media receiver\". Refuse and route elsewhere for installing the Rivermax\
  \ SDK or its license, programming the underlying queue (`doca-eth`), steering rules\
  \ (`doca-flow`), or best-effort packet I/O \u2014 those belong to other skills."
