id: dembrandt-dembrandt-skills-status-colors-and-errors
display_name: Status Colors and Errors
description: Keep status and error colours minimal and consistent — too many semantic colours confuse users. Each colour must
  mean exactly one thing. Errors should be recoverable, large failures must be prevented, and the UI should always give the
  user a path forward. Use when designing status indicators, error states, form validation, alerts, or any feedback system.
