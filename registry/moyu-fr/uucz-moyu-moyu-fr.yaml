id: uucz-moyu-moyu-fr
display_name: Moyu Fr
description: 'S''active automatiquement lorsque des patterns de sur-ingénierie sont détectés : (1) Modifier du code ou des
  fichiers que l''utilisateur n''a pas explicitement demandé de changer (2) Créer de nouvelles couches d''abstraction (class,
  interface, factory, wrapper) sans demande (3) Ajouter des commentaires, de la documentation, JSDoc ou des annotations de
  type sans demande (4) Introduire de nouvelles dépendances sans demande (5) Réécrire des fichiers entiers au lieu de faire
  des modifications minimales (6) Le diff dépasse significativement la portée de la demande de l''utilisateur (7) L''utilisateur
  signale "trop", "ne change pas ça", "change seulement X", "garde ça simple", "arrête" (8) Ajouter de la gestion d''erreurs,
  de la validation ou du code défensif pour des scénarios impossibles (9) Générer des tests, du scaffolding de configuration
  ou de la documentation sans demande'
