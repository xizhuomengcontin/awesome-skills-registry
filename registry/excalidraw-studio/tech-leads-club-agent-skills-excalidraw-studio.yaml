id: tech-leads-club-agent-skills-excalidraw-studio
display_name: Excalidraw Studio
description: Generate Excalidraw diagrams from natural language descriptions. Outputs .excalidraw JSON files openable in Excalidraw.
  Use when asked to "create a diagram", "make a flowchart", "visualize a process", "draw a system architecture", "create a
  mind map", "generate an Excalidraw file", "draw an ER diagram", "create a sequence diagram", or "make a class diagram".
  Supports flowcharts, relationship diagrams, mind maps, architecture, DFD, swimlane, class, sequence, and ER diagrams. Can
  use icon libraries (AWS, GCP, etc.) when set up. Do NOT use for code architecture analysis (use the architecture skills),
  Mermaid diagram rendering (use mermaid-studio), or non-visual documentation (use docs-writer).
