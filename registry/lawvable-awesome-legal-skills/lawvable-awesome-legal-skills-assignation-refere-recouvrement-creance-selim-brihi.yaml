display_name: Assignation Référé - Recouvrement de Créance
description: Rédaction d'assignations en référé devant le tribunal de commerce ou des activités économiques pour le recouvrement
  de créances commerciales. Utiliser ce skill quand l'utilisateur demande de rédiger, préparer ou créer une assignation en
  référé pour obtenir le paiement d'une créance impayée (factures, prestations de services, ventes de marchandises, etc.)
  lorsque le débiteur n'a pas honoré ses obligations de paiement et qu'il n'existe pas de contestation sérieuse.
