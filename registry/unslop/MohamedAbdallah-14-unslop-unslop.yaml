  uncertainty, and preserves technical accuracy. Supports intensity levels: subtle,
  balanced (default), full, voice-match, anti-detector. Use when user says "humanize
  this", "make this sound human", "de-slop this", "rewrite without AI tone", "match
  my voice", "less robotic", or invokes /unslop. Also auto-triggers when text-quality
  is requested.'
