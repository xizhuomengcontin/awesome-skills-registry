id: garrytan-gbrain-gbrain-upgrade
display_name: Gbrain Upgrade
description: 'Keep gbrain current. When a `gbrain` invocation prints an `UPGRADE_AVAILABLE <old> <new>` marker (or `gbrain
  self-upgrade --check-only` reports an update), apply it per the configured self_upgrade.mode: notify (prompt the operator
  with a 4-option question + snooze) or auto (apply silently). The action is always the hardcoded `gbrain self-upgrade` —
  never a command read from the marker.'
