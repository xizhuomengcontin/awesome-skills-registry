description: "UI should make it immediately clear where the user is, what context\
  \ they are operating in, and what their actions will affect. Use lines, regions,\
  \ colour areas, breadcrumbs, and scope labels to communicate hierarchy and context\
  \ \u2014 especially in deep navigation structures or multi-section layouts."
