id: NVIDIA-skills-tao-analyze-gaps-visual-changenet
display_name: tao-analyze-gaps-visual-changenet
description: "Performs gap analysis on NVIDIA TAO Visual ChangeNet (VCN) Classify\
  \ experiments by invoking the data-services container (`tao_toolkit.data_services`\
  \ from `versions.yaml`) directly via `docker run \u2026 gap_analysis vcn_aoi \u2026\
  ` \u2014 picks the optimal decision threshold, ranks per-sample weakness, and emits\
  \ a top-K weakest parquet expanded per-lighting for downstream augmentation. Use\
  \ when analyzing VCN classification failures, picking SDA augmentation targets,\
  \ auditing PASS/NO_PASS boundary cases, or running DEFT gap analysis on an AOI ChangeNet\
  \ model."
