id: dembrandt-dembrandt-skills-data-display-and-selection
description: "Complex data deserves multiple view modes \u2014 grid, list, table \u2014\
  \ chosen by the user based on their task. Row and item selection should use large\
  \ hit areas (the whole row or card, not just a checkbox). Selected state is communicated\
  \ through a subtle background colour shift. Mass actions appear when items are selected.\
  \ Use when designing data tables, product listings, file browsers, or any multi-item\
  \ collection."
