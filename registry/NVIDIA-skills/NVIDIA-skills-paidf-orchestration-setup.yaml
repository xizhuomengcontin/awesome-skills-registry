description: Audit, prepare, and deploy PAIDF Orchestration on a Kubernetes GPU cluster
  - single-GPU H100/L40S hosts, managed Kubernetes, kubeadm, and similar. Select for
  requests to set up, install, deploy, configure, or check a PAIDF Orchestration environment;
  run a workflow on a new or unverified GPU host; connect via kubeconfig; validate
  GPU compute; deploy the Airflow controller; or choose external versus in-cluster
  model services. A plain SSH host is not a supported backend.
