id: K-Dense-AI-claude-scientific-skills-scientific-writing
display_name: Scientific Writing
description: Core skill for the deep research and writing tool. Write scientific manuscripts in full paragraphs (never bullet
  points). Use two-stage process with (1) section outlines with key points using research-lookup then (2) convert to flowing
  prose. IMRAD structure, citations (APA/AMA/Vancouver), figures/tables, reporting guidelines (CONSORT/STROBE/PRISMA), for
  research papers and journal submissions.
