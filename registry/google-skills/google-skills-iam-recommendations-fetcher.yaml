id: google-skills-iam-recommendations-fetcher
display_name: iam-recommendations-fetcher
description: Fetches raw IAM recommendations and associated security insights from
  Google Cloud for a specified target scope (Organization, Folder, or Project). Use
  when you need to retrieve security recommendations before analyzing or applying
  them. Don't use for applying/acting on recommendations (use the recommendation applier
  skill) or for general allow policy querying (use the allow policy viewer skill).
