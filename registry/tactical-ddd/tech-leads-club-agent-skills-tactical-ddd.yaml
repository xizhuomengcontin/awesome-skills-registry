id: tech-leads-club-agent-skills-tactical-ddd
description: Detects anemic domain models, validates and refactors them into rich
  domain models, and enforces tactical DDD patterns (Entities, Value Objects, Aggregates,
  Domain Services, Domain Events). Use when the user asks to validate, review, or
  check domain models or DDD code; detect anemia; refactor domain objects; improve
  encapsulation; or mentions terms like "anemic model", "rich domain", "aggregate",
  "value object", "domain event", "ubiquitous language", "is this good DDD", "does
  this follow DDD", or "check my domain". Do NOT use for module or service boundary
  design, architectural decomposition, strategic DDD context mapping, or code outside
  the domain layer (DTOs, controllers, infrastructure adapters).
