id: trycourier-courier-skills-root
description: Use when building notifications with Courier across email, SMS, push,
  in-app inbox, Slack, Teams, or WhatsApp. Covers transactional messages (password
  reset, OTP, orders, billing), growth notifications (onboarding, engagement, referral),
  multi-channel routing, preferences and topics, reliability and webhooks, journeys
  (multi-step notification sequences via API), template CRUD and Elemental content,
  routing strategies, provider configuration, the Courier CLI and MCP server, and
  migrations from Knock, Novu, or other notification systems.
