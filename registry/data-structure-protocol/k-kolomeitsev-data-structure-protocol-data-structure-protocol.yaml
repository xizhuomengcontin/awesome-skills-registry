description: "Build and navigate DSP (Data Structure Protocol) \u2014 graph-based\
  \ long-term structural memory of codebases for LLM agents. Stores entities (modules,\
  \ functions), their dependencies (imports), public API (shared/exports), and reasons\
  \ for every connection. Use when: (1) project has a .dsp/ directory, (2) user asks\
  \ to set up DSP or bootstrap project structure, (3) creating/modifying/deleting\
  \ code files in a DSP-tracked project, (4) navigating project structure, understanding\
  \ dependencies, or finding modules, (5) user mentions DSP, dsp-cli, .dsp, or structure\
  \ mapping."
