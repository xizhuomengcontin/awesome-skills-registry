id: dembrandt-dembrandt-skills-layout-paradigms-and-consistency
display_name: layout-paradigms-and-consistency
description: "A layout is not a neutral container \u2014 choosing the right layout\
  \ paradigm (feed, board, table, canvas, master-detail, dashboard, gallery, timeline,\
  \ map, single-focus) is a design decision that shapes how content is understood.\
  \ Once chosen, the same paradigm and page skeleton must be reused consistently across\
  \ the application so users build one mental model. This is consistency at the macro\
  \ scale, above component and token consistency. Use when deciding the overall structure\
  \ of a screen, designing page templates, or reviewing whether screens across a product\
  \ feel like one coherent application."
