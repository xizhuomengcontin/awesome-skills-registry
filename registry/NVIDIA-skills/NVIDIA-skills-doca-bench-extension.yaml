id: NVIDIA-skills-doca-bench-extension
display_name: doca-bench-extension
description: "Use this skill when the operator is authoring, building, loading, or\
  \ debugging a custom doca-bench plug-in \u2014 a versioned shared library with DOCA_EXPERIMENTAL-marked\
  \ C entry points that doca-bench loads to measure a workload class its built-in\
  \ modes do not cover, with doca_bench_cuda as the shipped reference exemplar. Trigger\
  \ even when the user does not say \"doca-bench-extension\" or \"doca_bench_cuda\"\
  \ \u2014 typical implicit phrasings include \"no built-in doca-bench mode fits my\
  \ workload\", \"how do I benchmark a CUDA GPUNetIO RX/TX kernel\", \"doca-bench\
  \ cannot find or load my custom .so\", \"extension exported symbols do not match\
  \ what the parent expects\", \"soversion mismatch after a DOCA upgrade\", or \"\
  my GPU kernel hangs because stop_flag was never set\". Refuse and route elsewhere\
  \ for questions about which built-in doca-bench mode to pick, DOCA GPUNetIO programming\
  \ semantics, CUDA toolkit installation, or contributor work on in-tree extensions\
  \ \u2014 those belong to other skills."
