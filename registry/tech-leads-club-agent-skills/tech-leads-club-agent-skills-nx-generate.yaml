display_name: Nx Generate
description: Generate code using Nx generators — scaffold projects, libraries, features, or run workspace-specific generators
  with proper discovery, validation, and verification. Use when user says "create a new library", "scaffold a component",
  "generate code with Nx", "run a generator", "nx generate", or any code scaffolding task in a monorepo. Prefers local workspace-plugin
  generators over external plugins. Do NOT use for running build/test/lint tasks (use nx-run-tasks) or workspace configuration
  (use nx-workspace).
