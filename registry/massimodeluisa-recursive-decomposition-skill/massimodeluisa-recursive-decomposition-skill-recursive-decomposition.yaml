id: massimodeluisa-recursive-decomposition-skill-recursive-decomposition
display_name: recursive-decomposition
description: Based on the Recursive Language Models (RLM) research by Zhang, Kraska,
  and Khattab (2025), this skill provides strategies for handling tasks that exceed
  comfortable context limits through programmatic decomposition and recursive self-invocation.
  Triggers on phrases like "analyze all files", "process this large document", "aggregate
  information from", "search across the codebase", or tasks involving 10+ files or
  50k+ tokens.
