id: dembrandt-dembrandt-skills-component-family-consistency
description: "Buttons, inputs, pills, badges, calendars, and other interactive components\
  \ form a visual family \u2014 they share the same border-radius, colour logic, shadow\
  \ scale, border style, and spacing rhythm. Inconsistency between them breaks the\
  \ sense of a coherent product. Use when building or reviewing a component library,\
  \ design system, or any set of UI components."
