id: czlonkowski-n8n-skills-n8n-self-hosting
display_name: n8n-self-hosting
description: "Deploy a production self-hosted n8n end-to-end to a fresh Linux VM over\
  \ SSH, using Docker Compose behind a Caddy reverse proxy with automatic HTTPS. Use\
  \ whenever the user wants to self-host, install, set up, provision, or deploy n8n\
  \ on their own server/VPS/box (Hetzner, DigitalOcean, AWS EC2, bare metal, etc.)\
  \ \u2014 in either single/regular mode or queue mode with workers \u2014 or to update,\
  \ back up, restore, or harden such an instance. This is for SELF-HOSTED n8n (Docker),\
  \ not n8n Cloud and not building workflows. The skill makes the agent ask single-vs-queue\
  \ first, collect the domain/SSH/timezone inputs, generate fresh secrets on the box,\
  \ and bring the stack up with TLS. Trigger on \"deploy n8n\", \"self-host n8n\"\
  , \"install n8n on my server\", \"n8n docker compose\", \"n8n queue mode / workers\
  \ / scaling\", \"n8n reverse proxy / SSL\", or \"back up / update my n8n\"."
