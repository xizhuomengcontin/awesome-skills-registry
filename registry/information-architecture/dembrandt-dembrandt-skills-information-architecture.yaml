id: dembrandt-dembrandt-skills-information-architecture
display_name: Information Architecture
description: In large applications, information architecture determines whether users can find, understand, and act on data.
  Naming matters. The UI should mirror the data model and signal how data can be transformed. Dangerous or irreversible changes
  always require a confirm dialog. Use when designing navigation, naming entities, structuring large feature sets, or modelling
  data-driven UI.
