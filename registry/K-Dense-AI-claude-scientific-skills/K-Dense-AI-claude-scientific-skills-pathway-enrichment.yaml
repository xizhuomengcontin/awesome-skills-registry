id: K-Dense-AI-claude-scientific-skills-pathway-enrichment
display_name: Pathway Enrichment
description: Run pathway and gene-set enrichment analysis on gene lists or ranked gene data, then interpret the results. Use
  whenever the user has a set of genes (differentially expressed genes from PyDESeq2/Scanpy, CRISPR-screen hits, cluster marker
  genes, proteomics hits) and wants to know which biological pathways, GO terms, or gene sets are over-represented or enriched.
  Covers over-representation analysis (ORA / Enrichr / Fisher / hypergeometric), ranked Gene Set Enrichment Analysis (GSEA
  / preranked), single-sample scoring (ssGSEA/GSVA), and functional profiling via gseapy, g:Profiler, Enrichr libraries, MSigDB,
  GO, KEGG, Reactome, and WikiPathways — plus gene-ID mapping, choosing the right background universe, multiple-testing correction,
  redundancy reduction, dotplots/enrichment maps, and publication-ready tables. Use this for "pathway analysis", "enrichment
  analysis", "GO enrichment", "KEGG/Reactome pathways", "GSEA", "over-representation", "functional annotation", or "what pathways
  are my genes in".
