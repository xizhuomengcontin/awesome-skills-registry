description: "This skill covers integrating Static Application Security Testing (SAST)\
  \ tools\u2014CodeQL and Semgrep\u2014into GitHub Actions CI/CD pipelines. It addresses\
  \ configuring automated code scanning on pull requests and pushes, tuning rules\
  \ to reduce false positives, uploading SARIF results to GitHub Advanced Security,\
  \ and establishing quality gates that block merges when high-severity vulnerabilities\
  \ are detected."
