id: dembrandt-dembrandt-skills-micro-interactions
description: "Micro-interactions are small, purposeful animations and responses that\
  \ reward the user and make the interface feel alive \u2014 an animated icon, a satisfying\
  \ toggle, a subtle reveal. Borrowed from the natural world, they add delight without\
  \ distraction. Use when designing interactive components, success states, toggles,\
  \ loaders, or any moment worth celebrating."
