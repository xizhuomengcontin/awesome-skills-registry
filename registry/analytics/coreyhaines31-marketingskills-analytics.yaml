  "conversion tracking," "event tracking," "UTM parameters," "tag manager," "GTM,"
  "analytics implementation," "tracking plan," "how do I measure this," "track conversions,"
  "attribution," "Mixpanel," "Segment," "are my events firing," or "analytics isn't
  working." Use this whenever someone asks how to know if something is working or
  wants to measure marketing results. For A/B test measurement, see ab-testing.
