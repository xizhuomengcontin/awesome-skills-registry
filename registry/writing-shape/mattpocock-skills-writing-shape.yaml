description: "Take a markdown file of raw material and shape it into an article through\
  \ a conversational session \u2014 drafting candidate openings, growing the piece\
  \ paragraph by paragraph, arguing about format (lists, tables, callouts, quotes)\
  \ at each step. Use when the user has a pile of notes, fragments, or a rough draft\
  \ and wants help turning it into something publishable."
