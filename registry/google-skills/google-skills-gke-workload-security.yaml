id: google-skills-gke-workload-security
display_name: gke-workload-security
description: Audits, configures, and hardens workload-level security controls for
  Google Kubernetes Engine (GKE) applications and namespaces. Covers running cluster
  security audits (`audit_cluster.sh`), configuring Workload Identity Federation (impersonation,
  KSA/GSA binding, and pod setup), enforcing Network Policies (default-deny and Dataplane
  V2 logging), isolating high-risk pods inside GKE Sandbox (`gVisor`), enforcing Pod
  Security Standards (`restricted` labeling), and mounting Secret Manager secrets
  via CSI (`SecretProviderClass`). Use when auditing cluster security posture, isolating
  namespaces, applying pod security standards, setting up Workload Identity, or configuring
  network policies and secret volume mounts. Don't use for cluster-wide control plane
  security, RBAC hardening, Binary Authorization, Shielded Nodes, or enabling platform-level
  GKE add-ons (use gke-platform-security instead).
