id: tech-leads-club-agent-skills-component-flattening-analysis
display_name: Component Flattening Analysis
description: Detects misplaced classes and fixes component hierarchy problems — finds code that should belong inside a component
  but sits at the root level. Use when asking "clean up component structure", "find orphaned classes", "fix module hierarchy",
  "flatten nested components", or analyzing why namespaces have misplaced code. Do NOT use for dependency analysis (use coupling-analysis)
  or domain grouping (use domain-identification-grouping).
