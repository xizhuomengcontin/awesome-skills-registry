display_name: video-packaging
description: "Generate or critique video packaging \u2014 title + thumbnail-text pairs\
  \ where the title carries context and keywords, the thumbnail text carries the tension,\
  \ and any word echoed between them is rejected as wasted real estate. Generate mode\
  \ delivers 3 pairs tagged by discovery intent (search vs browse) with a recommendation\
  \ and A/B note; critique mode returns a PASS/FIX/FAIL verdict with 3 fixed pairs.\
  \ Triggers on \"/digital-marketing-pro:video-packaging\", \"title for this video\"\
  , \"thumbnail text ideas\", \"why is no one clicking this video\", \"critique this\
  \ title\", \"package this video\". Pairs with /digital-marketing-pro:video-script,\
  \ pulls real query phrasing from /digital-marketing-pro:keyword-research for search-intent\
  \ titles, and gates title claims through /digital-marketing-pro:check before anything\
  \ ships."
