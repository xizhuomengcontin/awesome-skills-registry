  test," "hypothesis," "should I test this," "which version is better," "test two
  versions," "statistical significance," "how long should I run this test," "growth
  experiments," "experiment velocity," "experiment backlog," "ICE score," "experimentation
  program," or "experiment playbook." Use this whenever someone is comparing two approaches
  and wants to measure which performs better, or when they want to build a systematic
  experimentation practice. For tracking implementation, see analytics. For page-level
  conversion optimization, see cro.
