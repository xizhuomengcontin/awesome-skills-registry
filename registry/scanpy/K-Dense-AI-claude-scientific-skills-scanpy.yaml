id: K-Dense-AI-claude-scientific-skills-scanpy
description: Standard single-cell RNA-seq analysis pipeline. Use for QC, normalization,
  dimensionality reduction (PCA/UMAP/t-SNE), clustering, differential expression,
  visualization, and converting R-friendly single-cell formats such as Seurat or SingleCellExperiment
  RDS files into h5ad for Scanpy. Best for exploratory scRNA-seq analysis with established
  workflows. For deep learning models use scvi-tools; for data format questions use
  anndata.
