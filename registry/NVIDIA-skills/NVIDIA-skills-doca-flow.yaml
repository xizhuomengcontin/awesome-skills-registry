id: NVIDIA-skills-doca-flow
display_name: doca-flow
description: 'Build and debug DOCA Flow applications on supported NVIDIA NICs/DPUs:
  define match/action pipes, initialize ports and representors, choose forwarding
  targets, validate pipes before hardware programming, read counters, match the Flow
  version to the installed DOCA release, and diagnose Flow API errors. Trigger on
  DOCA packet steering, classifier, representor, rule-matching, hairpin, or 5-tuple-to-queue
  questions even when "DOCA Flow" is not named. Route plain DPDK `rte_flow`, kernel
  TC, OVS, BFB bring-up, and DPU OS installation elsewhere. DPU OS installation is
  destructive and always requires explicit confirmation.'
