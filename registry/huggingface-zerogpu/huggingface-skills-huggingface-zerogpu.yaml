description: "AI demos and GPU compute with Gradio Spaces and Hugging Face Spaces\
  \ ZeroGPU. Use when writing or reviewing code that uses `@spaces.GPU`, configuring\
  \ `python_version` or `requirements.txt` for a ZeroGPU Space, or handling ZeroGPU-specific\
  \ code constraints \u2014 pickle-based process isolation, `gr.State` semantics across\
  \ the worker boundary, no `torch.compile` (use AoTI instead), CUDA wheel-only builds\
  \ (no `nvcc` at build or runtime), large vs xlarge sizing, and dynamic duration\
  \ callables. Make sure to use this skill whenever the user mentions ZeroGPU, `@spaces.GPU`,\
  \ or the `spaces` Python package, or hits ZeroGPU-specific code errors like `PicklingError`\
  \ across the worker boundary, `illegal duration`, or `flash-attn` wheel-build failures\
  \ \u2014 even when the user does not explicitly ask for ZeroGPU coding guidance.\
  \ Trigger on `import spaces` or `@spaces.GPU` in code."
