id: K-Dense-AI-claude-scientific-skills-statistical-power
display_name: statistical-power
description: "Sample-size and statistical power calculations for planning studies.\
  \ Use whenever someone asks \"how many subjects/samples/replicates do I need\",\
  \ wants an a priori power analysis, a minimum detectable effect (MDE), a power curve,\
  \ or needs to justify a sample size for a grant, IRB protocol, or pre-registration.\
  \ Covers closed-form power for t-tests, ANOVA, proportions, correlations, chi-square,\
  \ and regression, plus simulation-based (Monte Carlo) power for designs with no\
  \ formula \u2014 logistic/Poisson regression, mixed models, cluster-randomized trials,\
  \ survival, and interactions. Use this skill even when the request only mentions\
  \ an effect size, alpha, or \"80% power\" without saying \"power analysis\" explicitly.\
  \ For laying out the study (randomization, blocking, factorial/DOE, crossover, sequential\
  \ designs) use experimental-design; for analyzing data already collected and reporting\
  \ it use statistical-analysis."
