display_name: doca-dms
description: "SAFETY: several gNOI operations here \u2014 reboot, OS install, factory-reset\
  \ \u2014 are DESTRUCTIVE and IRREVERSIBLE and can take a production BlueField or\
  \ ConnectX offline; confirm the target device and require explicit user confirmation\
  \ before issuing any, and never invoke them speculatively. Use this skill for operating\
  \ NVIDIA DOCA Management Service (DMS) on a BlueField, Arm/x86 host, or K8s pod\
  \ \u2014 bringing up `dmsd` frontend + `dmspe` backend, picking deployment shape\
  \ and auth, wiring `-allowed_users` + `dmsgroup`, issuing gNMI Get/Set on YANG paths,\
  \ gNMI Subscribe for streaming telemetry, gNOI for reboot/OS install/factory-reset/file\
  \ transfer/`mlxconfig`/`containerz`, or debugging frontend-vs-backend errors and\
  \ logs. Trigger even without \"DMS\" \u2014 e.g. \"manage a remote BlueField over\
  \ gRPC\", \"gNOI reboot from orchestrator\", \"OS install over gRPC to a SmartNIC\"\
  . Refuse and route for DOCA install, library-API / sample-build questions, and the\
  \ DOCA Telemetry Service (DTS) turnkey aggregator-side stream consumer."
