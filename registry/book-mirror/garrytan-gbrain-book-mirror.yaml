id: garrytan-gbrain-book-mirror
description: Take any book (EPUB/PDF), produce a personalized chapter-by-chapter analysis
  with two-column tables. Left column preserves the chapter content; right column
  maps every idea to the reader's actual life using brain context. Output is a single
  brain page at media/books/<slug>-personalized.md plus an optional PDF via brain-pdf.
