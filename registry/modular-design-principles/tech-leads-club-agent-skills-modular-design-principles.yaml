id: tech-leads-club-agent-skills-modular-design-principles
description: "Technology-agnostic guidance for modular systems: bounded contexts,\
  \ clear boundaries, composability, state isolation, explicit contracts, failure\
  \ containment, scaffolding workflows, split/merge criteria, sub-units inside a context,\
  \ and compliance review signals. Use when designing or reviewing module structure,\
  \ service boundaries, package layout, cross-cutting dependencies, \"how should we\
  \ split this?\", modularity assessments, coupling between domains, greenfield context\
  \ design, or architecture discussions without assuming a specific framework, language,\
  \ or repository layout. Do NOT use for executing the full Patterns 1\u20135 repo\
  \ decomposition pipeline or per-pattern inventories (use modular-decomposition),\
  \ phased extraction roadmaps as the main deliverable (use decomposition-planning-roadmap),\
  \ or end-to-end legacy migration strategy (use legacy-migration-planner)."
