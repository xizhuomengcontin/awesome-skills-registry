display_name: Mouser Electronics
description: Search Mouser Electronics for electronic components — secondary source for prototype orders. Find parts, check
  pricing/stock, download datasheets, analyze specifications. Use with KiCad for BOM creation and part selection. Also supports
  batch MPN-list seeding (`--mpn-list`) for bulk datasheet workflows without a KiCad project. Use this skill when the user
  specifically mentions Mouser, when DigiKey is out of stock or has worse pricing, when comparing prices across distributors,
  or when searching for parts that DigiKey doesn't carry. For package cross-reference tables and BOM workflow, see the `bom`
  skill.
