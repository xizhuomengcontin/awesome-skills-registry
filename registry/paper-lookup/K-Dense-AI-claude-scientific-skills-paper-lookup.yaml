id: K-Dense-AI-claude-scientific-skills-paper-lookup
display_name: Paper Lookup
description: Search 10 academic paper databases via REST APIs for research papers, preprints, and scholarly articles. Covers
  PubMed, PMC (full text), bioRxiv, medRxiv, arXiv, OpenAlex, Crossref, Semantic Scholar, CORE, Unpaywall. Use when searching
  for papers, citations, DOI/PMID lookups, abstracts, full text, open access, preprints, citation graphs, author search, or
  any scholarly literature query. Triggers on mentions of any supported database or requests like "find papers on X" or "look
  up this DOI".
