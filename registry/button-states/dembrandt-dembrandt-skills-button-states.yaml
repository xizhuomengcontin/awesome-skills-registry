id: dembrandt-dembrandt-skills-button-states
description: "Every interactive element needs a complete set of visual states \u2014\
  \ rest, hover, active/pressed, focus, disabled, and loading. States should be derived\
  \ algorithmically from the base colour, not chosen arbitrarily. Use when designing\
  \ buttons, links, inputs, or any clickable component."
