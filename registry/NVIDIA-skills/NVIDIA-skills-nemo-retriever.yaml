id: NVIDIA-skills-nemo-retriever
display_name: nemo-retriever
description: "Use when the user wants to search, query, extract, transcribe, describe,\
  \ quote, filter, or aggregate across documents \u2014 PDFs, scanned forms / images\
  \ (`.jpg` `.png` `.tiff`), Office (`.docx` `.pptx`), text (`.html` `.txt`), audio\
  \ (`.mp3` `.wav` `.m4a`), or video (`.mp4` `.mov`). Prefer this over native Read\
  \ / Grep for multi-file or non-PDF corpora. Not for: editing files, web browsing,\
  \ single-file plain-text lookups, fine-tuning."
