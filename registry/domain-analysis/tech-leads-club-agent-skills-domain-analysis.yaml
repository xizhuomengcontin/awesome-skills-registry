id: tech-leads-club-agent-skills-domain-analysis
display_name: Domain Analysis
description: Maps business domains and suggests service boundaries in any codebase using DDD Strategic Design. Use when asking
  "what are the domains in this codebase?", "where should I draw service boundaries?", "identify bounded contexts", "classify
  subdomains", "DDD analysis", or analyzing domain cohesion. Do NOT use for grouping existing components into domains (use
  domain-identification-grouping) or dependency analysis (use coupling-analysis).
